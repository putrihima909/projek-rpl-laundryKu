<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 540" width="380" height="540">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&amp;display=swap');
      text { font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    </style>
    <filter id="ai-widget-shadow" x="-10%" y="-5%" width="120%" height="115%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-opacity="0.16"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="380" height="540" fill="#F8FAFC" />

  <!-- Main Chat Panel -->
  <rect x="10" y="10" width="360" height="520" rx="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#ai-widget-shadow)" />

  <!-- Header Gradient -->
  <path d="M10 28C10 18.0589 18.0589 10 28 10H352C361.941 10 370 18.0589 370 28V74H10V28Z" fill="url(#ai-grad)" />
  <defs>
    <linearGradient id="ai-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
  </defs>

  <!-- Bot Avatar in Header -->
  <circle cx="42" cy="42" r="18" fill="#FFFFFF" />
  <!-- Robot Face Icon -->
  <rect x="33" y="34" width="18" height="16" rx="4" fill="#2563EB"/>
  <circle cx="38" cy="40" r="2" fill="#FFFFFF"/>
  <circle cx="46" cy="40" r="2" fill="#FFFFFF"/>
  <line x1="42" y1="28" x2="42" y2="34" stroke="#FFFFFF" stroke-width="2"/>
  <!-- Status Online Indicator -->
  <circle cx="56" cy="54" r="5" fill="#22C55E" stroke="#FFFFFF" stroke-width="2"/>

  <!-- Header Title & Subtitle -->
  <text x="70" y="38" font-size="15px" font-weight="700" fill="#FFFFFF">SmartBot AI Assistant</text>
  <text x="70" y="54" font-size="11px" font-weight="500" fill="#E0E7FF">Online • Tanya apa saja tentang laundry!</text>

  <!-- Minimize / Close Button -->
  <circle cx="342" cy="42" r="14" fill="rgba(255, 255, 255, 0.2)" />
  <line x1="337" y1="37" x2="347" y2="47" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
  <line x1="347" y1="37" x2="337" y2="47" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>

  <!-- Chat History Area -->

  <!-- 1. Bot Welcome Message Bubble -->
  <g transform="translate(26, 96)">
    <rect width="280" height="82" rx="14" fill="#F1F5F9" />
    <path d="M0 14L8 20V8L0 14Z" fill="#F1F5F9" transform="translate(-8, 0)"/>
    <text x="14" y="24" font-size="13px" font-weight="600" fill="#0F172A">Halo! 👋 Ada yang bisa saya bantu?</text>
    <text x="14" y="44" font-size="12px" font-weight="400" fill="#475569">Misalnya: cari toko terdekat, cek status</text>
    <text x="14" y="62" font-size="12px" font-weight="400" fill="#475569">pesanan Anda, atau rekomendasi layanan.</text>
    <text x="240" y="74" font-size="10px" font-weight="500" fill="#94A3B8">09:00</text>
  </g>

  <!-- 2. User Message Bubble -->
  <g transform="translate(100, 196)">
    <rect width="254" height="48" rx="14" fill="#2563EB" />
    <text x="14" y="24" font-size="12px" font-weight="500" fill="#FFFFFF">Rekomendasi laundry terbaik di dekat</text>
    <text x="14" y="40" font-size="12px" font-weight="500" fill="#FFFFFF">Jl. Melati No. 12 dong!</text>
    <text x="220" y="40" font-size="10px" font-weight="500" fill="#93C5FD">09:01</text>
  </g>

  <!-- 3. Bot Reply Bubble -->
  <g transform="translate(26, 260)">
    <rect width="290" height="98" rx="14" fill="#F1F5F9" />
    <text x="14" y="22" font-size="12px" font-weight="600" fill="#2563EB">✨ Rekomendasi Terdekat:</text>
    <text x="14" y="42" font-size="12px" font-weight="600" fill="#0F172A">CleanMaster Laundry Express</text>
    <text x="14" y="60" font-size="11px" font-weight="400" fill="#475569">Jarak: 1.2 km • Rating 4.8 ★ (1.2k ulasan)</text>
    <text x="14" y="78" font-size="11px" font-weight="500" fill="#16A34A">Layanan Cuci Komplit mulai Rp 8.000/kg</text>
    <text x="250" y="90" font-size="10px" font-weight="500" fill="#94A3B8">09:01</text>
  </g>

  <!-- Quick Suggestions Bar -->
  <g transform="translate(26, 380)">
    <text x="0" y="0" font-size="11px" font-weight="600" fill="#64748B">Saran Cepat:</text>
    
    <!-- Chip 1 -->
    <g transform="translate(0, 8)">
      <rect width="170" height="26" rx="13" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
      <text x="85" y="17" font-size="11px" font-weight="500" fill="#2563EB" text-anchor="middle">📦 Cek Status Pesanan</text>
    </g>

    <!-- Chip 2 -->
    <g transform="translate(180, 8)">
      <rect width="144" height="26" rx="13" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
      <text x="72" y="17" font-size="11px" font-weight="500" fill="#2563EB" text-anchor="middle">🏷️ Kupon Diskon Aktif</text>
    </g>
  </g>

  <!-- Bottom Input Bar -->
  <g transform="translate(26, 440)">
    <rect width="328" height="52" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5" />
    <text x="16" y="31" font-size="13px" fill="#94A3B8">Tulis pesan ke SmartBot...</text>

    <!-- Send Button Icon -->
    <circle cx="298" cy="26" r="18" fill="#2563EB" />
    <!-- Paperplane Icon -->
    <path d="M292 21L306 26L292 31L296 26L292 21Z" fill="#FFFFFF"/>
  </g>

</svg>