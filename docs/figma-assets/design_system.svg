<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&amp;display=swap');
      text { font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .title { font-size: 26px; font-weight: 700; fill: #1E293B; }
      .subtitle { font-size: 14px; font-weight: 500; fill: #64748B; }
      .section-header { font-size: 18px; font-weight: 600; fill: #0F172A; }
      .label { font-size: 12px; font-weight: 500; fill: #64748B; }
      .hex { font-size: 11px; font-weight: 600; fill: #94A3B8; font-family: monospace; }
      .btn-text { font-size: 14px; font-weight: 600; text-anchor: middle; dominant-baseline: middle; }
      .badge-text { font-size: 11px; font-weight: 600; text-anchor: middle; dominant-baseline: middle; }
    </style>
    <filter id="shadow-soft" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.06"/>
    </filter>
    <filter id="btn-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#2563EB" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="800" fill="#F8FAFC" />

  <!-- Main Card Container -->
  <rect x="40" y="40" width="1120" height="720" rx="20" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" filter="url(#shadow-soft)" />

  <!-- Header Section -->
  <g transform="translate(80, 80)">
    <!-- App Logo Icon -->
    <rect x="0" y="0" width="48" height="48" rx="12" fill="#2563EB" />
    <path d="M24 14C20 14 17 17 17 21C17 26 24 33 24 33C24 33 31 26 31 21C31 17 28 14 24 14Z" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="24" cy="21" r="3" fill="#2563EB"/>

    <text x="64" y="24" class="title">LaundryKu (WashMart) — Design System Tokens</text>
    <text x="64" y="44" class="subtitle">Spesifikasi Komponen Desain &amp; Palet Warna Resmi untuk Prototipe Figma</text>
  </g>

  <!-- 1. Color Palette Section -->
  <g transform="translate(80, 170)">
    <text x="0" y="0" class="section-header">1. Color Palette (Palet Warna)</text>

    <!-- Primary Blue -->
    <g transform="translate(0, 20)">
      <rect width="90" height="60" rx="10" fill="#2563EB" />
      <text x="0" y="78" class="label">Primary Blue</text>
      <text x="0" y="94" class="hex">#2563EB</text>
    </g>

    <!-- Secondary Cyan -->
    <g transform="translate(110, 20)">
      <rect width="90" height="60" rx="10" fill="#06B6D4" />
      <text x="0" y="78" class="label">Secondary</text>
      <text x="0" y="94" class="hex">#06B6D4</text>
    </g>

    <!-- Success Green -->
    <g transform="translate(220, 20)">
      <rect width="90" height="60" rx="10" fill="#22C55E" />
      <text x="0" y="78" class="label">Success</text>
      <text x="0" y="94" class="hex">#22C55E</text>
    </g>

    <!-- Warning Orange -->
    <g transform="translate(330, 20)">
      <rect width="90" height="60" rx="10" fill="#F59E0B" />
      <text x="0" y="78" class="label">Warning</text>
      <text x="0" y="94" class="hex">#F59E0B</text>
    </g>

    <!-- Error Red -->
    <g transform="translate(440, 20)">
      <rect width="90" height="60" rx="10" fill="#EF4444" />
      <text x="0" y="78" class="label">Error Red</text>
      <text x="0" y="94" class="hex">#EF4444</text>
    </g>

    <!-- Neutral Gray -->
    <g transform="translate(550, 20)">
      <rect width="90" height="60" rx="10" fill="#6B7280" />
      <text x="0" y="78" class="label">Neutral</text>
      <text x="0" y="94" class="hex">#6B7280</text>
    </g>

    <!-- Dark Slate -->
    <g transform="translate(660, 20)">
      <rect width="90" height="60" rx="10" fill="#1E293B" />
      <text x="0" y="78" class="label">Dark Slate</text>
      <text x="0" y="94" class="hex">#1E293B</text>
    </g>

    <!-- Surface White -->
    <g transform="translate(770, 20)">
      <rect width="90" height="60" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />
      <text x="0" y="78" class="label">Surface White</text>
      <text x="0" y="94" class="hex">#FFFFFF</text>
    </g>

    <!-- Canvas BG -->
    <g transform="translate(880, 20)">
      <rect width="90" height="60" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" />
      <text x="0" y="78" class="label">Canvas BG</text>
      <text x="0" y="94" class="hex">#F8FAFC</text>
    </g>
  </g>

  <!-- Divider Line -->
  <line x1="80" y1="310" x2="1120" y2="310" stroke="#F1F5F9" stroke-width="2" />

  <!-- 2. Typography Hierarchy -->
  <g transform="translate(80, 340)">
    <text x="0" y="0" class="section-header">2. Typography Hierarchy (Poppins)</text>

    <text x="0" y="36" font-size="28px" font-weight="700" fill="#1E293B">H1 32px Bold — Headline Banner</text>
    <text x="0" y="72" font-size="22px" font-weight="600" fill="#1E293B">H2 24px Semibold — Page Titles</text>
    <text x="0" y="104" font-size="18px" font-weight="600" fill="#1E293B">H3 20px Semibold — Section Titles</text>
    <text x="0" y="132" font-size="15px" font-weight="400" fill="#334155">Body 16px Regular — Deskripsi pesanan, konten formulir, dan pesan chatbot AI</text>
    <text x="0" y="156" font-size="13px" font-weight="500" fill="#64748B">Caption 14px Regular — Helper text, timestamp status, dan rincian kupon</text>
  </g>

  <!-- 3. Component Buttons & Badges -->
  <g transform="translate(680, 340)">
    <text x="0" y="0" class="section-header">3. Button &amp; Badge Components</text>

    <!-- Primary Button -->
    <g transform="translate(0, 20)">
      <rect width="180" height="44" rx="10" fill="#2563EB" filter="url(#btn-shadow)"/>
      <text x="90" y="22" class="btn-text" fill="#FFFFFF">Primary Button</text>
    </g>

    <!-- Secondary Button -->
    <g transform="translate(200, 20)">
      <rect width="180" height="44" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
      <text x="90" y="22" class="btn-text" fill="#2563EB">Secondary Button</text>
    </g>

    <!-- Success Button -->
    <g transform="translate(0, 80)">
      <rect width="180" height="44" rx="10" fill="#22C55E" />
      <text x="90" y="22" class="btn-text" fill="#FFFFFF">Success Button</text>
    </g>

    <!-- Pill Badges -->
    <g transform="translate(200, 84)">
      <!-- Pesanan Baru -->
      <g transform="translate(0, 0)">
        <rect width="90" height="26" rx="13" fill="#FEF3C7" stroke="#FDE68A" stroke-width="1"/>
        <text x="45" y="13" class="badge-text" fill="#D97706">Pesanan Baru</text>
      </g>
      <!-- Diproses -->
      <g transform="translate(98, 0)">
        <rect width="80" height="26" rx="13" fill="#DBEAFE" stroke="#BFDBFE" stroke-width="1"/>
        <text x="40" y="13" class="badge-text" fill="#2563EB">Diproses</text>
      </g>
    </g>

    <g transform="translate(200, 118)">
      <!-- Dikirim -->
      <g transform="translate(0, 0)">
        <rect width="80" height="26" rx="13" fill="#DCFCE7" stroke="#BBF7D0" stroke-width="1"/>
        <text x="40" y="13" class="badge-text" fill="#16A34A">Dikirim</text>
      </g>
      <!-- Selesai -->
      <g transform="translate(88, 0)">
        <rect width="80" height="26" rx="13" fill="#F3F4F6" stroke="#E5E7EB" stroke-width="1"/>
        <text x="40" y="13" class="badge-text" fill="#374151">Selesai</text>
      </g>
    </g>
  </g>

  <!-- Divider Line -->
  <line x1="80" y1="530" x2="1120" y2="530" stroke="#F1F5F9" stroke-width="2" />

  <!-- 4. Form Input Fields & Navigation Elements -->
  <g transform="translate(80, 560)">
    <text x="0" y="0" class="section-header">4. Input Field &amp; Navigation Icons</text>

    <!-- Standard Input Field -->
    <g transform="translate(0, 20)">
      <rect width="440" height="48" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
      <!-- Search Icon -->
      <circle cx="28" cy="24" r="7" stroke="#94A3B8" stroke-width="2" fill="none"/>
      <line x1="33" y1="29" x2="39" y2="35" stroke="#94A3B8" stroke-width="2"/>
      <text x="50" y="29" font-size="14px" fill="#94A3B8">Cari toko laundry atau nomor invoice...</text>
    </g>

    <!-- Active Input Field Focus -->
    <g transform="translate(0, 80)">
      <rect width="440" height="48" rx="10" fill="#FFFFFF" stroke="#2563EB" stroke-width="2" />
      <text x="24" y="29" font-size="14px" font-weight="500" fill="#1E293B">Budi Santoso</text>
      <!-- Green Check Icon -->
      <circle cx="416" cy="24" r="10" fill="#22C55E"/>
      <path d="M412 24L415 27L420 21" stroke="#FFFFFF" stroke-width="2" fill="none"/>
    </g>
  </g>

  <!-- Navigation Icons Preview -->
  <g transform="translate(680, 560)">
    <text x="0" y="0" class="section-header">5. Navigation Item Tokens (24px)</text>

    <g transform="translate(0, 24)">
      <!-- Home Icon -->
      <g transform="translate(0, 0)">
        <rect width="48" height="48" rx="12" fill="#EFF6FF" />
        <path d="M16 26L24 18L32 26V32H16V26Z" stroke="#2563EB" stroke-width="2" fill="none"/>
        <text x="24" y="66" class="label" text-anchor="middle">Home</text>
      </g>

      <!-- Order Icon -->
      <g transform="translate(72, 0)">
        <rect width="48" height="48" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
        <rect x="18" y="20" width="12" height="14" rx="2" stroke="#64748B" stroke-width="2" fill="none"/>
        <path d="M18 20L21 16H27L30 20" stroke="#64748B" stroke-width="2" fill="none"/>
        <text x="24" y="66" class="label" text-anchor="middle">Order</text>
      </g>

      <!-- Chat AI Icon -->
      <g transform="translate(144, 0)">
        <rect width="48" height="48" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
        <circle cx="24" cy="24" r="8" stroke="#64748B" stroke-width="2" fill="none"/>
        <circle cx="21" cy="23" r="1.5" fill="#64748B"/>
        <circle cx="27" cy="23" r="1.5" fill="#64748B"/>
        <line x1="24" y1="12" x2="24" y2="16" stroke="#64748B" stroke-width="2"/>
        <text x="24" y="66" class="label" text-anchor="middle">Chat AI</text>
      </g>

      <!-- Profile Icon -->
      <g transform="translate(216, 0)">
        <rect width="48" height="48" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
        <circle cx="24" cy="21" r="5" stroke="#64748B" stroke-width="2" fill="none"/>
        <path d="M16 32C16 28 19 27 24 27C29 27 32 28 32 32" stroke="#64748B" stroke-width="2" fill="none"/>
        <text x="24" y="66" class="label" text-anchor="middle">Profil</text>
      </g>

      <!-- Settings Icon -->
      <g transform="translate(288, 0)">
        <rect width="48" height="48" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
        <circle cx="24" cy="24" r="4" stroke="#64748B" stroke-width="2" fill="none"/>
        <path d="M24 16V18M24 30V32M16 24H18M30 24H32" stroke="#64748B" stroke-width="2" stroke-linecap="round"/>
        <text x="24" y="66" class="label" text-anchor="middle">Settings</text>
      </g>
    </g>
  </g>

</svg>