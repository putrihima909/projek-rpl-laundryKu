<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 640" width="420" height="640">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&amp;display=swap');
      text { font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    </style>
    <filter id="qris-card-shadow" x="-10%" y="-5%" width="120%" height="115%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="420" height="640" fill="#F8FAFC" />

  <!-- Stand Card -->
  <rect x="20" y="20" width="380" height="600" rx="20" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#qris-card-shadow)" />

  <!-- Top QRIS Red Brand Bar -->
  <path d="M20 40C20 28.9543 28.9543 20 40 20H380C391.046 20 400 28.9543 400 40V72H20V40Z" fill="#DC2626" />
  <text x="210" y="52" font-size="20px" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="2px">QRIS</text>
  <text x="210" y="66" font-size="9px" font-weight="600" fill="#FEE2E2" text-anchor="middle" letter-spacing="1px">PEMBAYARAN DIGITAL RESMI INDONESIA</text>

  <!-- Merchant Info -->
  <g transform="translate(40, 96)">
    <text x="170" y="0" font-size="16px" font-weight="700" fill="#0F172A" text-anchor="middle">CleanMaster Laundry Express</text>
    <text x="170" y="18" font-size="11px" font-weight="500" fill="#64748B" text-anchor="middle">NMID: ID102004889123 • A01</text>
  </g>

  <!-- QR Code Container Box -->
  <g transform="translate(85, 140)">
    <rect width="250" height="250" rx="16" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5" />
    
    <!-- Stylized QR Code Pattern (Scalable Vector) -->
    <!-- Corner Finder Patterns -->
    <!-- Top-Left -->
    <rect x="20" y="20" width="56" height="56" rx="8" fill="#1E293B" />
    <rect x="28" y="28" width="40" height="40" rx="4" fill="#FFFFFF" />
    <rect x="36" y="36" width="24" height="24" rx="2" fill="#1E293B" />

    <!-- Top-Right -->
    <rect x="174" y="20" width="56" height="56" rx="8" fill="#1E293B" />
    <rect x="182" y="28" width="40" height="40" rx="4" fill="#FFFFFF" />
    <rect x="190" y="36" width="24" height="24" rx="2" fill="#1E293B" />

    <!-- Bottom-Left -->
    <rect x="20" y="174" width="56" height="56" rx="8" fill="#1E293B" />
    <rect x="28" y="182" width="40" height="40" rx="4" fill="#FFFFFF" />
    <rect x="36" y="190" width="24" height="24" rx="2" fill="#1E293B" />

    <!-- QR Data Matrix Pixels -->
    <g fill="#1E293B">
      <rect x="90" y="24" width="12" height="12" rx="2"/>
      <rect x="110" y="24" width="12" height="12" rx="2"/>
      <rect x="130" y="24" width="12" height="12" rx="2"/>
      <rect x="146" y="24" width="12" height="12" rx="2"/>

      <rect x="90" y="44" width="12" height="12" rx="2"/>
      <rect x="122" y="44" width="12" height="12" rx="2"/>
      <rect x="146" y="44" width="12" height="12" rx="2"/>

      <rect x="24" y="90" width="12" height="12" rx="2"/>
      <rect x="44" y="90" width="12" height="12" rx="2"/>
      <rect x="64" y="90" width="12" height="12" rx="2"/>
      <rect x="90" y="90" width="12" height="12" rx="2"/>
      <rect x="110" y="90" width="12" height="12" rx="2"/>
      <rect x="130" y="90" width="12" height="12" rx="2"/>
      <rect x="150" y="90" width="12" height="12" rx="2"/>
      <rect x="174" y="90" width="12" height="12" rx="2"/>
      <rect x="214" y="90" width="12" height="12" rx="2"/>

      <rect x="24" y="110" width="12" height="12" rx="2"/>
      <rect x="64" y="110" width="12" height="12" rx="2"/>
      <rect x="174" y="110" width="12" height="12" rx="2"/>
      <rect x="194" y="110" width="12" height="12" rx="2"/>

      <rect x="24" y="130" width="12" height="12" rx="2"/>
      <rect x="44" y="130" width="12" height="12" rx="2"/>
      <rect x="90" y="130" width="12" height="12" rx="2"/>
      <rect x="150" y="130" width="12" height="12" rx="2"/>
      <rect x="194" y="130" width="12" height="12" rx="2"/>
      <rect x="214" y="130" width="12" height="12" rx="2"/>

      <rect x="90" y="150" width="12" height="12" rx="2"/>
      <rect x="110" y="150" width="12" height="12" rx="2"/>
      <rect x="130" y="150" width="12" height="12" rx="2"/>
      <rect x="174" y="150" width="12" height="12" rx="2"/>

      <rect x="90" y="174" width="12" height="12" rx="2"/>
      <rect x="130" y="174" width="12" height="12" rx="2"/>
      <rect x="150" y="174" width="12" height="12" rx="2"/>
      <rect x="194" y="174" width="12" height="12" rx="2"/>
      <rect x="214" y="174" width="12" height="12" rx="2"/>

      <rect x="90" y="198" width="12" height="12" rx="2"/>
      <rect x="110" y="198" width="12" height="12" rx="2"/>
      <rect x="150" y="198" width="12" height="12" rx="2"/>
      <rect x="174" y="198" width="12" height="12" rx="2"/>
      <rect x="194" y="198" width="12" height="12" rx="2"/>

      <rect x="90" y="218" width="12" height="12" rx="2"/>
      <rect x="130" y="218" width="12" height="12" rx="2"/>
      <rect x="174" y="218" width="12" height="12" rx="2"/>
    </g>

    <!-- Center QRIS Mini Badge -->
    <rect x="105" y="105" width="40" height="40" rx="8" fill="#FFFFFF" stroke="#DC2626" stroke-width="2" />
    <text x="125" y="129" font-size="10px" font-weight="800" fill="#DC2626" text-anchor="middle">QRIS</text>
  </g>

  <!-- Total Nominal Amount -->
  <g transform="translate(40, 420)">
    <text x="170" y="0" font-size="12px" font-weight="600" fill="#64748B" text-anchor="middle" letter-spacing="0.5px">TOTAL PEMBAYARAN</text>
    <text x="170" y="30" font-size="28px" font-weight="800" fill="#2563EB" text-anchor="middle">Rp 35.000</text>
  </g>

  <!-- Countdown Timer Pill -->
  <g transform="translate(110, 470)">
    <rect width="200" height="32" rx="16" fill="#FEF3C7" stroke="#FDE68A" stroke-width="1"/>
    <!-- Hourglass Icon -->
    <path d="M22 10V14L26 18L22 22V26H32V22L28 18L32 14V10H22Z" fill="#D97706" transform="translate(0, -2) scale(0.8)"/>
    <text x="110" y="20" font-size="12px" font-weight="600" fill="#D97706" text-anchor="middle">Berlaku dalam: 14:59</text>
  </g>

  <!-- Action Simulation Button -->
  <g transform="translate(50, 524)">
    <rect width="320" height="44" rx="10" fill="#22C55E" />
    <text x="160" y="27" font-size="14px" font-weight="600" fill="#FFFFFF" text-anchor="middle">Bayar Sekarang (Simulasi Lunas)</text>
  </g>

  <!-- Supported Gateways / Logos Text -->
  <g transform="translate(40, 595)">
    <text x="170" y="0" font-size="10px" font-weight="500" fill="#94A3B8" text-anchor="middle">Mendukung BCA, Mandiri, BRI, GoPay, OVO, DANA, ShopeePay &amp; Seluruh Bank</text>
  </g>

</svg>