
name: LaundryKu CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  php-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Check PHP Syntax
        run: |
          find . -type f -name "*.php" \
            -not -path "./vendor/*" -print0 |
          while IFS= read -r -d '' file; do
            php -l "$file" || exit 1
          done
